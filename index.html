<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Flexiones</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="color-scheme" content="dark">
<meta name="description" content="Contador diario de flexiones. Objetivo: 50 al día.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flexiones">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0d0d0d;--sur:#171717;--line:#2a2a2a;--neon:#39ff14;--txt:#fff;--dim:#8d8d8d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt)}
body{font-family:"Bahnschrift","Roboto Condensed","Roboto",system-ui,sans-serif;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);user-select:none;-webkit-user-select:none}
header{padding:18px 20px 4px;display:flex;align-items:baseline;justify-content:space-between}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:.14em;color:var(--neon)}
#fecha{color:var(--dim);font-size:.95rem}
main{flex:1;overflow-y:auto;padding:8px 20px 24px;max-width:520px;width:100%;margin:0 auto}
.view[hidden]{display:none}
button{font:inherit;color:inherit;border:0;background:none;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
button:disabled{cursor:not-allowed}
/* HOY */
.count{text-align:center;margin:18px 0 6px;line-height:1}
#num{display:block;font-size:clamp(7rem,40vw,10.5rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.goal{font-size:1.3rem;color:var(--dim);margin-top:4px}
.goal b{color:var(--txt)}
.bar{height:16px;border-radius:8px;background:var(--sur);border:1px solid var(--line);overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--neon);box-shadow:0 0 14px var(--neon);border-radius:8px;transition:width .35s ease}
.pct{display:flex;justify-content:space-between;color:var(--dim);font-size:.95rem}
.pct b{color:var(--neon);font-size:1.1rem}
#ok{margin:18px 0 0;padding:14px;border:2px solid var(--neon);border-radius:16px;text-align:center;font-size:1.35rem;font-weight:800;color:var(--neon);box-shadow:0 0 18px rgba(57,255,20,.3)}
#ok[hidden]{display:none}
.btn-main{display:block;width:100%;margin-top:22px;height:96px;border-radius:24px;background:var(--neon);color:#000;font-size:2rem;font-weight:800;letter-spacing:.04em;transition:transform .08s}
.btn-main:active:not(:disabled){transform:scale(.97)}
.btn-main:disabled{background:#1f2a1c;color:#5c6b58}
.row{display:flex;gap:12px;margin-top:12px}
.btn-sec{flex:1;height:64px;border-radius:18px;border:2px solid var(--neon);color:var(--neon);font-size:1.4rem;font-weight:700}
.btn-sec:active:not(:disabled){background:rgba(57,255,20,.12)}
.btn-sec:disabled{border-color:var(--line);color:#4a4a4a}
.btn-sec.quiet{border-color:var(--line);color:var(--dim);font-size:1.05rem;font-weight:600}
/* CALENDARIO */
.mes{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
#mesTitulo{font-size:1.3rem;font-weight:700}
.nav{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);font-size:1.5rem;color:var(--neon)}
.nav:disabled{color:#444}
.sem,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sem span{text-align:center;color:var(--dim);font-size:.85rem;padding:4px 0}
.d{aspect-ratio:1;border-radius:12px;background:var(--sur);border:1px solid var(--line);font-size:1.05rem;font-weight:600;position:relative;font-variant-numeric:tabular-nums}
.d.vacio{visibility:hidden}
.d.parcial::after{content:"";position:absolute;bottom:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--neon)}
.d.hecho{background:var(--neon);color:#000;border-color:var(--neon);font-weight:800}
.d.hoy{outline:2px solid #fff;outline-offset:1px}
.d.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--neon)}
.d:disabled{color:#454545;background:transparent;border-style:dashed}
.leyenda{display:flex;gap:16px;color:var(--dim);font-size:.85rem;margin:12px 2px}
.leyenda s{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px;text-decoration:none}
.panel{margin-top:14px;padding:18px;border-radius:20px;background:var(--sur);border:1px solid var(--line)}
.panel h2{margin:0 0 6px;font-size:1.05rem;font-weight:600;color:var(--dim);text-transform:capitalize}
.panel .big{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.panel .big small{font-size:1.3rem;color:var(--dim);font-weight:600}
.estado{margin-top:8px;font-size:1.1rem;font-weight:700}
.estado.si{color:var(--neon)}.estado.no{color:var(--dim)}
.nota{margin:12px 0 0;color:var(--dim);font-size:.9rem}
.panel .btn-sec{width:100%;flex:none;margin-top:14px;height:52px;font-size:1.1rem}
/* PESTAÑAS */
nav.tabs{display:flex;border-top:1px solid var(--line);background:#0a0a0a;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;height:62px;font-size:1.05rem;font-weight:700;color:var(--dim);border-top:3px solid transparent}
.tab[aria-selected="true"]{color:var(--neon);border-top-color:var(--neon)}
/* MODAL */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9}
#modal[hidden]{display:none}
.caja{background:var(--sur);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:380px;width:100%}
.caja h2{margin:0 0 8px;font-size:1.4rem}
.caja p{margin:0 0 18px;color:var(--dim);line-height:1.4}
.caja .row{margin:0}
.caja .btn-sec{height:54px;font-size:1.1rem}
#si{background:var(--neon);color:#000}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>FLEXIONES</h1><span id="fecha"></span></header>
<main>
 <section id="vHoy" class="view" aria-label="Hoy">
  <div class="count"><span id="num" aria-live="polite">0</span><div class="goal">de <b>50</b> flexiones</div></div>
  <div class="bar" role="progressbar" aria-label="Progreso diario" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
  <div class="pct"><span>Progreso de hoy</span><b id="pct">0%</b></div>
  <div id="ok" role="status" hidden>¡Objetivo completado! 💪</div>
  <button id="mas" class="btn-main" type="button">+5 FLEXIONES</button>
  <div class="row">
   <button id="menos" class="btn-sec" type="button">−5</button>
   <button id="reiniciar" class="btn-sec quiet" type="button">Reiniciar día</button>
  </div>
 </section>
 <section id="vCal" class="view" aria-label="Calendario" hidden>
  <div class="mes">
   <button id="prev" class="nav" type="button" aria-label="Mes anterior">‹</button>
   <span id="mesTitulo"></span>
   <button id="next" class="nav" type="button" aria-label="Mes siguiente">›</button>
  </div>
  <div class="sem"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
  <div id="grid" class="grid"></div>
  <div class="leyenda"><span><s style="background:var(--neon)"></s>50 completadas</span><span><s style="background:var(--sur);border:1px solid var(--neon)"></s>Con progreso</span></div>
  <div class="panel" id="panel"></div>
 </section>
</main>
<nav class="tabs" role="tablist">
 <button class="tab" id="tHoy" role="tab" aria-selected="true" type="button">Hoy</button>
 <button class="tab" id="tCal" role="tab" aria-selected="false" type="button">Calendario</button>
</nav>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt" hidden>
 <div class="caja">
  <h2 id="mt">¿Reiniciar el día?</h2>
  <p id="mp"></p>
  <div class="row"><button id="no" class="btn-sec quiet" type="button">Cancelar</button><button id="si" class="btn-sec" type="button">Sí, reiniciar</button></div>
 </div>
</div>
<script>
'use strict';
/*LOGIC-START*/
const KEY = 'flexiones:v1', GOAL = 50, STEP = 5;
const pad = (n) => String(n).padStart(2, '0');
// Fecha LOCAL del móvil en formato YYYY-MM-DD (sin toISOString, que usa UTC)
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function clampCount(v) { v = Math.round(Number(v)); return isFinite(v) ? Math.min(GOAL, Math.max(0, v)) : 0; }
function step(cur, delta) { return clampCount(clampCount(cur) + delta); }
function loadDays(storage) {
  const out = {};
  try {
    const p = JSON.parse(storage.getItem(KEY) || '{}');
    if (p && p.days) for (const k in p.days) if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { const c = clampCount(p.days[k]); if (c > 0) out[k] = c; }
  } catch (e) {}
  return out;
}
function saveDays(storage, days) { try { storage.setItem(KEY, JSON.stringify({ v: 1, days: days })); return true; } catch (e) { return false; } }
/*LOGIC-END*/

const $ = (id) => document.getElementById(id);
const store = (() => { try { const t = '__t'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return localStorage; } catch (e) { const m = {}; return { getItem: (k) => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); } }; } })();
let days = loadDays(store);
let today = dateKey(new Date());
let calY, calM, selected;
let tab = 'hoy';

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLargo = (k) => parseKey(k).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

function goToday() { const d = new Date(); calY = d.getFullYear(); calM = d.getMonth(); selected = today; }
goToday();

function renderHoy() {
  const n = days[today] || 0, pct = Math.round(n / GOAL * 100);
  $('fecha').textContent = cap(new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' }));
  $('num').textContent = n;
  $('fill').style.width = pct + '%';
  $('pct').textContent = pct + '%';
  document.querySelector('.bar').setAttribute('aria-valuenow', pct);
  $('ok').hidden = n < GOAL;
  $('mas').disabled = n >= GOAL;
  $('mas').textContent = n >= GOAL ? 'META CUMPLIDA' : '+' + STEP + ' FLEXIONES';
  $('menos').disabled = n <= 0;
  $('reiniciar').disabled = n <= 0;
}

function renderCal() {
  const now = new Date(), first = new Date(calY, calM, 1);
  const offset = (first.getDay() + 6) % 7, dim = new Date(calY, calM + 1, 0).getDate();
  $('mesTitulo').textContent = cap(first.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }));
  $('next').disabled = calY === now.getFullYear() && calM === now.getMonth();
  let h = '';
  for (let i = 0; i < offset; i++) h += '<span class="d vacio"></span>';
  for (let d = 1; d <= dim; d++) {
    const k = calY + '-' + pad(calM + 1) + '-' + pad(d), n = days[k] || 0;
    const cls = ['d']; if (n >= GOAL) cls.push('hecho'); else if (n > 0) cls.push('parcial');
    if (k === today) cls.push('hoy'); if (k === selected) cls.push('sel');
    h += '<button type="button" class="' + cls.join(' ') + '" data-k="' + k + '"' + (k > today ? ' disabled' : '') + ' aria-label="' + fmtLargo(k) + ': ' + n + ' flexiones">' + d + '</button>';
  }
  $('grid').innerHTML = h;
  const n = days[selected] || 0, ok = n >= GOAL, esHoy = selected === today;
  $('panel').innerHTML = '<h2>' + fmtLargo(selected) + '</h2><div class="big">' + n + ' <small>/ ' + GOAL + ' flexiones</small></div>' +
    '<div class="estado ' + (ok ? 'si' : 'no') + '">' + (ok ? '✔ Objetivo completado' : (esHoy ? 'Objetivo en curso' : 'Objetivo no completado')) + '</div>' +
    '<p class="nota">Solo consulta: el historial no se puede modificar desde aquí.</p>' +
    (esHoy ? '' : '<button type="button" class="btn-sec" id="irHoy">Ir a hoy</button>');
  const b = $('irHoy'); if (b) b.onclick = () => showTab('hoy');
}

function render() { renderHoy(); if (tab === 'cal') renderCal(); }

function showTab(t) {
  tab = t;
  if (t === 'cal') { goToday(); }
  $('vHoy').hidden = t !== 'hoy'; $('vCal').hidden = t !== 'cal';
  $('tHoy').setAttribute('aria-selected', t === 'hoy'); $('tCal').setAttribute('aria-selected', t === 'cal');
  render();
}

// Cambio de día automático: se comprueba al reabrir la app, al volver a primer plano y cada 20 s
function checkDay() {
  const n = dateKey(new Date());
  if (n !== today) { today = n; goToday(); render(); }
}

function change(delta) {
  checkDay();
  const next = step(days[today] || 0, delta);
  if (next > 0) days[today] = next; else delete days[today];
  saveDays(store, days);
  renderHoy();
}

$('mas').onclick = () => change(STEP);
$('menos').onclick = () => change(-STEP);
$('reiniciar').onclick = () => {
  checkDay();
  $('mp').textContent = 'Se borrarán las ' + (days[today] || 0) + ' flexiones de hoy. El historial de otros días no se toca.';
  $('modal').hidden = false; $('no').focus();
};
$('no').onclick = () => { $('modal').hidden = true; };
$('si').onclick = () => { delete days[dateKey(new Date())]; saveDays(store, days); $('modal').hidden = true; checkDay(); render(); };
$('modal').onclick = (e) => { if (e.target === $('modal')) $('modal').hidden = true; };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('modal').hidden = true; });

$('tHoy').onclick = () => showTab('hoy');
$('tCal').onclick = () => showTab('cal');
$('prev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); };
$('next').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); };
$('grid').onclick = (e) => { const b = e.target.closest('[data-k]'); if (b && !b.disabled) { selected = b.dataset.k; renderCal(); } };

document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
window.addEventListener('focus', checkDay);
window.addEventListener('pageshow', checkDay);
window.addEventListener('storage', (e) => { if (e.key === KEY) { days = loadDays(store); render(); } });
setInterval(checkDay, 20000);

render();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
</body>
</html>
